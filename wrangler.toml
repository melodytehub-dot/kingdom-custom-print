# Wrangler configuration for direct CLI deployment
name = "kingdom-custom-print"
main = ".cloudflare/output/v0/workers/default/index.js"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".cloudflare/output/v0/workers/default/assets" }

[triggers]
crons = ["0 * * * *"]

# KV namespace for Vinext cache
[[kv_namespaces]]
binding = "VINEXT_KV_CACHE"
id = "b93c6df2d79f47f8ae6e5b0d560c35bc"

# Primary database (SQLite). Replaces the Neon Postgres + Hyperdrive setup.
[[d1_databases]]
binding = "DB"
database_name = "kingdom-custom-print"
database_id = "d40d9352-2ef1-416c-8948-8a6601113c30"

# Product photos and hosted-cutout bridge images.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kingdom-custom-print-media"

# Custom routes
[[routes]]
pattern = "kingdomcustomprint.com/*"
custom_domain = true

[[routes]]
pattern = "www.kingdomcustomprint.com/*"
custom_domain = true

# Observability
[observability]
enabled = true

[observability.logs]
enabled = true
